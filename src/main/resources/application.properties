spring.application.name=operations
app.error-log.path=parameter-errors.json
app.container-name=local
app.persons-csv.path=personas.csv

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false