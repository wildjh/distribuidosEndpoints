spring.application.name=operations
mensaje=Servicio de personas
vm=local
app.error-log.path=parameter-errors.json
app.container-name=local
app.persons-csv.path=personas.csv

# La URL JDBC la arma DataSourceConfig desde DB_HOST/DB_USER/DB_PASSWORD.
# No uses SPRING_DATASOURCE_URL en Docker (si tiene ${DB_HOST}, falla).

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
